name: PR Checks

# Só checagens: nada é gerado nem enviado às lojas.
on:
  pull_request:
    branches:
      - main

# Um push novo no mesmo PR cancela a checagem anterior.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  check:
    name: Typecheck, lint, testes e expo-doctor
    environment: production
    steps:
      - uses: eas/checkout

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck, lint e testes unitários
        run: npm run check

      - name: Versões compatíveis com o SDK
        run: npx -y expo-doctor
