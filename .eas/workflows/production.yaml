name: Produção

# Só roda quando você decide publicar:
#   - criando uma tag de versão:  git tag v1.2.0 && git push origin v1.2.0
#   - ou manualmente:             npx eas-cli workflow:run production.yaml  (ou pelo expo.dev)
# Android vai para a faixa "production" e entra em revisão.
# iOS vai para o TestFlight; a versão é enviada à revisão da Apple no App Store Connect.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Duas publicações seguidas entram em fila: a segunda espera a primeira terminar.
# Não cancela a anterior, para não interromper um envio às lojas no meio.
concurrency:
  group: ${{ workflow.filename }}
  cancel_in_progress: false

jobs:
  check:
    name: Typecheck, lint, testes e expo-doctor
    environment: production
    steps:
      - uses: eas/checkout

      - name: Instalar dependências
        run: npm ci

      - name: Variáveis de ambiente do EAS
        run: |
          : "${EXPO_PUBLIC_API_URL:?EXPO_PUBLIC_API_URL não definida}"
          : "${EXPO_PUBLIC_GLOBOID_BASE_URL:?EXPO_PUBLIC_GLOBOID_BASE_URL não definida}"
          : "${EXPO_PUBLIC_AUTH_URL:?EXPO_PUBLIC_AUTH_URL não definida}"
          : "${EXPO_PUBLIC_GLOBOID_CLIENT_ID:?EXPO_PUBLIC_GLOBOID_CLIENT_ID não definida}"
          : "${EXPO_PUBLIC_GLOBOID_TOKEN_KEY_LOCAL_STORAGE:?EXPO_PUBLIC_GLOBOID_TOKEN_KEY_LOCAL_STORAGE não definida}"

      - name: Typecheck, lint e testes unitários
        run: npm run check

      - name: Versões compatíveis com o SDK
        run: npx -y expo-doctor

  build_android:
    name: Build Android
    type: build
    needs: [check]
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    needs: [check]
    params:
      platform: ios
      profile: production

  submit_android:
    name: Enviar Android (produção)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Enviar iOS (TestFlight)
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
