name: Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint & Type Check
    type: custom
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: npm ci

      - name: Validate env vars
        run: |
          : "${EXPO_PUBLIC_API_URL:?EXPO_PUBLIC_API_URL is not set}"
          : "${EXPO_PUBLIC_GLOBOID_BASE_URL:?EXPO_PUBLIC_GLOBOID_BASE_URL is not set}"
          : "${EXPO_PUBLIC_AUTH_URL:?EXPO_PUBLIC_AUTH_URL is not set}"
          : "${EXPO_PUBLIC_GLOBOID_CLIENT_ID:?EXPO_PUBLIC_GLOBOID_CLIENT_ID is not set}"
          : "${EXPO_PUBLIC_GLOBOID_TOKEN_KEY_LOCAL_STORAGE:?EXPO_PUBLIC_GLOBOID_TOKEN_KEY_LOCAL_STORAGE is not set}"

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

  build_ios:
    name: Build iOS
    type: build
    needs: [lint]
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    needs: [lint]
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    params:
      platform: android
      profile: production
